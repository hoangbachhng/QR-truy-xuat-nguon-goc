<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="UTM Neo Sans Intel, Segoe UI, Arial, sans-serif"><rect width="960" height="400" fill="#fff"/><text x="30" y="40" font-size="20" fill="#005b36" font-weight="700" text-anchor="start">Lịch bón phân VNR98 – Đồng bằng sông Cửu Long</text><text x="30" y="64" font-size="14" fill="#808285"  text-anchor="start">Lượng bón cho 1 ha (kg)</text><line x1="83" y1="150" x2="847" y2="150" stroke="#789a3d" stroke-width="4" stroke-linecap="round"/><path d="M847 142 L861 150 L847 158 Z" fill="#789a3d"/><circle cx="113" cy="150" r="11" fill="#005b36" stroke="#fff" stroke-width="3"/><text x="113" y="106" font-size="16" fill="#00512d" font-weight="700" text-anchor="middle">Bón lót</text><text x="113" y="126" font-size="13" fill="#808285"  text-anchor="middle">Trước khi sạ</text><rect x="33.25" y="178" width="159.5" height="54" rx="10" fill="#f1f2f2" stroke="#d1d3d4"/><text x="113" y="208" font-size="15" fill="#351800"  text-anchor="middle">50 DAP</text><circle cx="286.5" cy="150" r="11" fill="#005b36" stroke="#fff" stroke-width="3"/><text x="286.5" y="106" font-size="16" fill="#00512d" font-weight="700" text-anchor="middle">Thúc 1</text><text x="286.5" y="126" font-size="13" fill="#808285"  text-anchor="middle">8–10 ngày sau sạ</text><rect x="206.75" y="178" width="159.5" height="102" rx="10" fill="#f1f2f2" stroke="#d1d3d4"/><text x="286.5" y="208" font-size="15" fill="#351800"  text-anchor="middle">50 DAP</text><text x="286.5" y="232" font-size="15" fill="#351800"  text-anchor="middle">40 Urê</text><text x="286.5" y="256" font-size="15" fill="#351800"  text-anchor="middle">20 KCl</text><circle cx="460" cy="150" r="11" fill="#005b36" stroke="#fff" stroke-width="3"/><text x="460" y="106" font-size="16" fill="#00512d" font-weight="700" text-anchor="middle">Thúc 2</text><text x="460" y="126" font-size="13" fill="#808285"  text-anchor="middle">Sau tỉa, dặm</text><rect x="380.25" y="178" width="159.5" height="102" rx="10" fill="#f1f2f2" stroke="#d1d3d4"/><text x="460" y="208" font-size="15" fill="#351800"  text-anchor="middle">50 DAP</text><text x="460" y="232" font-size="15" fill="#351800"  text-anchor="middle">60 Urê</text><text x="460" y="256" font-size="15" fill="#351800"  text-anchor="middle">30 KCl</text><circle cx="633.5" cy="150" r="11" fill="#e8b909" stroke="#fff" stroke-width="3"/><text x="633.5" y="106" font-size="16" fill="#00512d" font-weight="700" text-anchor="middle">Đón đòng</text><text x="633.5" y="126" font-size="13" fill="#808285"  text-anchor="middle">Đòng dài 3–4 mm</text><rect x="553.75" y="178" width="159.5" height="78" rx="10" fill="#f1f2f2" stroke="#d1d3d4"/><text x="633.5" y="208" font-size="15" fill="#351800"  text-anchor="middle">40 Urê</text><text x="633.5" y="232" font-size="15" fill="#351800"  text-anchor="middle">30 KCl</text><circle cx="807" cy="150" r="11" fill="#e8b909" stroke="#fff" stroke-width="3"/><text x="807" y="106" font-size="16" fill="#00512d" font-weight="700" text-anchor="middle">Nuôi hạt</text><text x="807" y="126" font-size="13" fill="#808285"  text-anchor="middle">Lúa trỗ đều</text><rect x="727.25" y="178" width="159.5" height="78" rx="10" fill="#f1f2f2" stroke="#d1d3d4"/><text x="807" y="208" font-size="15" fill="#351800"  text-anchor="middle">20 Urê</text><text x="807" y="232" font-size="15" fill="#351800"  text-anchor="middle">20 KCl</text><rect x="30" y="338" width="900" height="40" rx="8" fill="#005b36"/><text x="480" y="364" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Tổng: 150 kg DAP + 160 kg Urê + 100 kg KCl / ha (điều chỉnh theo vùng đất và mùa vụ)</text></svg>