<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="UTM Neo Sans Intel, Segoe UI, Arial, sans-serif"><rect width="960" height="300" fill="#fff"/><text x="30" y="40" font-size="20" fill="#005b36" font-weight="700" text-anchor="start">Ngâm ủ hạt giống VNR98 – Đồng bằng sông Cửu Long</text><text x="30" y="64" font-size="14" fill="#808285"  text-anchor="start">Lượng giống 100 kg/ha khi mặt ruộng tốt, đã diệt sạch ốc bươu vàng</text><rect x="40" y="100" width="190" height="130" rx="14" fill="#f1f2f2" stroke="#d1d3d4"/><text x="135" y="140" font-size="17" fill="#00512d" font-weight="700" text-anchor="middle">1. Ngâm</text><text x="135" y="174" font-size="22" fill="#351800" font-weight="700" text-anchor="middle">24 giờ</text><text x="135" y="202" font-size="15" fill="#351800"  text-anchor="middle">bằng nước sạch</text><path d="M238 165 L262 165" stroke="#789a3d" stroke-width="4"/><path d="M256 157 L266 165 L256 173 Z" fill="#789a3d"/><rect x="270" y="100" width="190" height="130" rx="14" fill="#f1f2f2" stroke="#d1d3d4"/><text x="365" y="140" font-size="17" fill="#00512d" font-weight="700" text-anchor="middle">2. Rửa giống</text><text x="365" y="174" font-size="22" fill="#351800" font-weight="700" text-anchor="middle">lúc 12 giờ</text><text x="365" y="202" font-size="15" fill="#351800"  text-anchor="middle">và 24 giờ sau ngâm</text><path d="M468 165 L492 165" stroke="#789a3d" stroke-width="4"/><path d="M486 157 L496 165 L486 173 Z" fill="#789a3d"/><rect x="500" y="100" width="190" height="130" rx="14" fill="#f1f2f2" stroke="#d1d3d4"/><text x="595" y="140" font-size="17" fill="#00512d" font-weight="700" text-anchor="middle">3. Ủ</text><text x="595" y="174" font-size="22" fill="#351800" font-weight="700" text-anchor="middle">12–36 giờ</text><text x="595" y="202" font-size="15" fill="#351800"  text-anchor="middle">ở 30–35°C</text><path d="M698 165 L722 165" stroke="#789a3d" stroke-width="4"/><path d="M716 157 L726 165 L716 173 Z" fill="#789a3d"/><rect x="730" y="100" width="190" height="130" rx="14" fill="#005b36" stroke="#005b36"/><text x="825" y="140" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">4. Gieo</text><text x="825" y="174" font-size="22" fill="#e8b909" font-weight="700" text-anchor="middle">rễ mầm dài</text><text x="825" y="202" font-size="15" fill="#fff"  text-anchor="middle">bằng ½ hạt</text><text x="480" y="270" font-size="14" fill="#808285"  text-anchor="middle">Rửa hết nước chua, để ráo vỏ hạt trước khi ủ. Theo dõi nhiệt độ, ẩm độ trong suốt quá trình ủ.</text></svg>