# Triển khai trên server Vinaseed: website + PostgreSQL, dữ liệu lưu trong 2 volume.
# 1. Sao chép .env.example thành .env, điền PUBLIC_BASE_URL, AUTH_SECRET, ADMIN_*, POSTGRES_PASSWORD
# 2. docker compose up -d --build
# 3. Trỏ Nginx/IIS (HTTPS) của công ty về cổng 3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vinaseed
      POSTGRES_USER: vinaseed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinaseed -d vinaseed"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vinaseed:${POSTGRES_PASSWORD}@db:5432/vinaseed
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/data

volumes:
  pgdata:
  uploads:
